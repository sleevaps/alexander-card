<style>
  :root {
    color-scheme: dark;
    --ink: #f5f4e8;
    --muted: #d0d1bf;
    --accent: #deeb9a;
    --background: #161714;
    --line: #414438;
    --display: Unbounded, system-ui, sans-serif;
    --body: Manrope, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--ink);
    font: 500 1rem/1.65 var(--body);
  }
  h1, h2, p, figure { margin: 0; }
  .frame { width: min(1180px, calc(100% - 2 * clamp(20px, 6vw, 72px))); margin-inline: auto; }
  .cover {
    overflow: clip;
    background:
      radial-gradient(ellipse at 83% 49%, #3d442e, transparent 55%),
      var(--background);
  }
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, .92fr);
    align-items: center;
    min-height: min(770px, 94svh);
    padding-block: clamp(62px, 11svh, 132px);
    perspective: 1050px;
    transform-style: preserve-3d;
  }
  .copy { position: relative; z-index: 1; }
  .copy-inner { animation: copy-in .75s .12s both cubic-bezier(.22, 1, .36, 1); }
  h1 {
    font: 700 clamp(2.2rem, 5.25vw, 5rem)/1.08 var(--display);
    letter-spacing: -.073em;
  }
  .name { display: block; color: var(--accent); margin-bottom: .12em; }
  .note { margin-block: 1.4rem 1.75rem; max-width: 34ch; color: var(--muted); font-size: clamp(1rem, 1.55vw, 1.2rem); }
  .action {
    display: inline-flex;
    align-items: center;
    gap: .65em;
    min-height: 46px;
    padding: 9px 15px;
    border: 1px solid currentColor;
    border-radius: 4px;
    background: transparent;
    color: var(--accent);
    font: 800 .95rem/1.25 var(--body);
    text-decoration: none;
    cursor: pointer;
    transition: color .2s, background-color .2s, transform .2s;
  }
  .action:hover { color: var(--background); background: var(--accent); }
  .action:active { transform: translateY(2px); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }

  .art { position: relative; isolation: isolate; perspective: 900px; }
  .orbit {
    position: absolute;
    z-index: -1;
    inset: -15% -9%;
    border: 1px solid #deeb9a4a;
    border-radius: 50%;
    transform: rotate(-37deg) scaleY(.48);
  }
  .orbit::after {
    position: absolute;
    inset: -15%;
    border: 1px solid #deeb9a27;
    border-radius: inherit;
    content: "";
  }
  .photo-group {
    position: relative;
    width: min(100%, 465px);
    margin-inline: auto;
    transform-style: preserve-3d;
    transform: rotateX(var(--pitch, 4deg)) rotateY(var(--yaw, -8deg)) rotateZ(5deg);
    transition: transform .38s cubic-bezier(.2, .7, .25, 1);
  }
  .photo-group::before {
    position: absolute;
    inset: 1% -5% -6% 5%;
    border: 1px solid #deeb9a68;
    background: #adb98118;
    transform: translateZ(-32px) rotate(-9deg);
    content: "";
  }
  .photo {
    padding: 8px;
    border: 1px solid #e2e5ce4f;
    background: #292d24;
    box-shadow: 0 28px 64px #0c0f09ad;
    animation: photo-in 1.05s both cubic-bezier(.2, .8, .25, 1);
  }
  .photo img { display: block; width: 100%; height: auto; }

  .wishes { border-top: 1px solid var(--line); padding-block: clamp(36px, 7vw, 90px); }
  .wishes h2 { margin-bottom: 1.1em; font: 500 clamp(1.25rem, 3vw, 2.25rem)/1.25 var(--display); letter-spacing: -.045em; }
  .stream { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15em .45em; font-size: clamp(1.05rem, 2vw, 1.75rem); }
  .it { max-width: 100%; overflow-wrap: anywhere; }
  .wb, .wf { color: var(--accent); }
  .wd, .we { font-weight: 800; }
  .cm { color: #a3a897; }
  .more { margin-top: 26px; }
  .more[hidden] { display: none; }

  @keyframes copy-in {
    from { opacity: 0; transform: translateY(22px); }
  }
  @keyframes photo-in {
    from { opacity: 0; transform: translate3d(0, 42px, -100px) rotateY(20deg) scale(.9); }
  }
  @media (max-width: 740px) {
    .stage { grid-template-columns: minmax(0, 1fr); min-height: 0; gap: 44px; padding-block: 44px 62px; }
    h1 { font-size: clamp(1.9rem, 7.8vw, 3.7rem); }
    .art { grid-row: 1; width: min(80%, 360px); justify-self: center; }
    .photo-group { transform: rotateZ(4deg); }
    .note { margin-block: 1rem 1.25rem; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .copy-inner, .photo, .photo-group, .action { animation: none; transition: none; }
    .photo-group, .action:active { transform: none; }
  }

<script>
  const stage = document.querySelector('.stage');
  const photoGroup = document.querySelector('.photo-group');
  const tiltEnabled = matchMedia('(min-width: 741px) and (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)');
  let stageRect = null;

  stage.addEventListener('pointermove', event => {
    if (!tiltEnabled.matches || event.pointerType === 'touch') return;
    stageRect ??= stage.getBoundingClientRect();
    const x = (event.clientX - stageRect.left) / stageRect.width - .5;
    const y = (event.clientY - stageRect.top) / stageRect.height - .5;
    photoGroup.style.setProperty('--pitch', (4 - y * 20) + 'deg');
    photoGroup.style.setProperty('--yaw', (-8 + x * 28) + 'deg');
  });

  function resetTilt() {
    stageRect = null;
    photoGroup.style.removeProperty('--pitch');
    photoGroup.style.removeProperty('--yaw');
  }

  stage.addEventListener('pointerleave', resetTilt);
  window.addEventListener('scroll', resetTilt, { passive: true });
  window.addEventListener('resize', resetTilt);
  tiltEnabled.addEventListener('change', resetTilt);
</script>

  }

  renderVals() {
    this.ensure(this.state.count);
    return {
      words: this.words.slice(0, this.state.count),
      setSentinel: this.setSentinel,
      more: this.more
    };
  }
}

const comp = new Component();
const stream = document.getElementById('stream');
const dots = document.getElementById('dots');
let shown = 0;
function paint() {
  const v = comp.renderVals();
  const frag = document.createDocumentFragment();
  for (; shown < v.words.length; shown++) {
    const w = v.words[shown];
    const s = document.createElement('span');
    s.className = w.cls;
    s.textContent = w.text;
    const c = document.createElement('span');
    c.className = 'cm';
    c.textContent = ',';
    s.appendChild(c);
    frag.appendChild(s);
  }
  stream.insertBefore(frag, dots);
}
comp.setSentinel(document.getElementById('sentinel'));
const moreButton = document.getElementById('more');
moreButton.addEventListener('click', () => comp.more());
moreButton.hidden = false;
paint();
comp.componentDidMount();

</script>
</body>
</html>
