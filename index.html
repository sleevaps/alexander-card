<!doctype html>
<html lang="ru">

<title>Александр, с днём рождения!</title>
<meta property="og:title" content="Александр, с днём рождения!">

<style>
  :root {
    --ink: #252a36;
    --blue: #344d79;
    --paper: #fffdfa;
    --line: #dedfe4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: clamp(18px, 5vw, 52px) 16px;
    color: var(--ink);
    background: #f0eeea;
    font: 1rem/1.6 system-ui, sans-serif;
  }
  .card {
    max-width: 760px;
    margin-inline: auto;
    padding: clamp(19px, 4.4vw, 44px);
    border: 1px solid var(--line);
    border-top: 4px solid var(--blue);
    border-radius: 8px;
    background: var(--paper);
  }
  h1 {
    margin: 0 0 22px;
    color: var(--blue);
    font-size: clamp(1.85rem, 5vw, 2.9rem);
    line-height: 1.12;
    letter-spacing: -.04em;
  }
  .greeting {
    display: grid;
    grid-template-columns: minmax(0, .9fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(20px, 4vw, 36px);
  }
  img { display: block; width: 100%; height: auto; border-radius: 4px; }
  .note p { margin: 0; }
  .note p + p { margin-top: .8em; }
  main { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line); }
  h2 { margin: 0 0 8px; color: var(--blue); font-size: 1.2rem; }
  .stream { display: flex; flex-wrap: wrap; gap: .15em .37em; }
  .it { max-width: 100%; overflow-wrap: anywhere; }
  .cm { color: #686d77; }
  button {
    margin-top: 18px;
    min-height: 44px;
    padding: 7px 13px;
    border: 1px solid #bcc7dc;
    border-radius: 5px;
    background: #edf1f7;
    color: var(--blue);
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #dfe7f3; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  @media (max-width: 550px) {
    .greeting { grid-template-columns: minmax(0, 1fr); }
    .greeting img { max-width: 360px; }
  }
</style>

<body>

<header>

    <img src="alexander-photo.png" width="640" height="640" alt="Александр во дворе, фото со вспышкой">
    <div class="note">
      <p>Эту фотку я всё-таки поставил :)</p>
      <p>Желаю, чтобы всё, что ты задумал, получилось. И чтобы почаще удавалось собраться со своими.</p>
    </div>
  </div>
</header>
<main>
  <h2>Ну и ещё желаю</h2>
  <div id="stream" class="stream">
    <span id="dots" aria-hidden="true">…</span>
    <noscript>Здоровья, удачи и побольше поводов для радости!</noscript>
  </div>
  <button id="more" type="button" hidden>Ещё пожеланий</button>
  <div id="sentinel"></div>
</main>
</div>

  draw(key, pool) {
    if (!this[key] || !this[key].length) {
      let arr = pool.slice();
      if (!this[key + 'Init']) {
        this[key + 'Init'] = true;
        if (key === 'nDeck') arr = arr.filter((p) => this.base.indexOf(p[0]) === -1);
      }
      for (let k = arr.length - 1; k > 0; k--) {
        const j = Math.floor(this.rand() * (k + 1));
        const t = arr[k]; arr[k] = arr[j]; arr[j] = t;
      }
      this[key] = arr;
    }
    return this[key].pop();
  }

  rand() {
    this.seed = (this.seed * 1664525 + 1013904223) % 4294967296;
    return this.seed / 4294967296;
  }

  nextWord(i) {
    if (i < this.base.length) return this.base[i];
    this.allN = this.allN || this.nouns.concat(this.extra);
    this.allA = this.allA || this.adj.concat(this.adj2.filter((a) => a[0] !== 'море'));
    const pick = this.draw('nDeck', this.allN);
    if (pick[1] !== 'x' && this.rand() < 0.35) {
      const a = this.draw('aDeck', this.allA);
      const form = pick[1] === 'f' ? a[1] : pick[1] === 'p' ? a[2] : a[0];
      return form + ' ' + pick[0];
    }
    return pick[0];
  }

  ensure(n) {
    while (this.words.length < n) {
      const i = this.words.length;
      const r = this.rand();
      const c = this.cls[(i * 5 + Math.floor(r * 4)) % this.cls.length];
      this.words.push({ text: this.nextWord(i), cls: 'it ' + c });
    }
  }

  setSentinel = (el) => { this.sentinel = el; };

  add = (n) => {
    const now = Date.now();
    if (now - this.lastAdd < 120) return;
    this.lastAdd = now;
    this.setState({ count: this.state.count + (n || 40) });
  };

  more = () => { this.add(60); };

  check = () => {
    if (!this.sentinel) return;
    const r = this.sentinel.getBoundingClientRect();
    const vh = window.innerHeight || 800;
    if (r.top < vh * 2.2) this.add(40);
  };

  componentDidMount() {
    window.addEventListener('scroll', this.check, true);
    window.addEventListener('wheel', this.check, { passive: true });
    window.addEventListener('touchmove', this.check, { passive: true });
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.check, true);
    window.removeEventListener('wheel', this.check);
    window.removeEventListener('touchmove', this.check);
  }

const comp = new Component();
const stream = document.getElementById('stream');
const dots = document.getElementById('dots');
let shown = 0;
function paint() {
  const v = comp.renderVals();
  const frag = document.createDocumentFragment();
  for (; shown < v.words.length; shown++) {
    const w = v.words[shown];
    const s = document.createElement('span');
    s.className = w.cls;
    s.textContent = w.text;
    const c = document.createElement('span');
    c.className = 'cm';
    c.textContent = ',';
    s.appendChild(c);
    frag.appendChild(s);
  }
  stream.insertBefore(frag, dots);
}
comp.setSentinel(document.getElementById('sentinel'));
const moreButton = document.getElementById('more');
moreButton.addEventListener('click', () => comp.more());
moreButton.hidden = false;
paint();
comp.componentDidMount();
