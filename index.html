<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Александр, с днём рождения!</title>
<meta name="description" content="Ночная прогулка и поздравление для Александра.">
<meta property="og:title" content="Александр, с днём рождения!">
<meta property="og:image" content="https://sleevaps.github.io/alexander-card/alexander-photo.png">
<meta name="theme-color" content="#101530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;800;900&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="journey" id="top">
  <div class="stage">
    <div class="sky"></div>
    <div class="render" aria-hidden="true"></div>
    <img class="portrait" src="alexander-photo.png" width="640" height="640" alt="Александр во дворе, фото со вспышкой">
    <div class="opening">
      <h1>Александр,<br><span>с днём<br>рождения.</span></h1>
      <p>Твоя фотка вышла прогуляться. Листай за ней.</p>
      <div class="controls">
        <a class="follow" href="#walk">Пошли <span aria-hidden="true">↓</span></a>
        <a class="skip" href="#wishes">К пожеланиям</a>
      </div>
    </div>
    <div class="route" aria-hidden="true"><span>Ночная прогулка</span><i></i></div>
  </div>
  <span id="walk"></span>
</header>
<main id="wishes">
  <section class="letter" aria-labelledby="letter-title">
    <figure><img src="alexander-night.png" width="640" height="640" alt="Ночной портрет Александра в зелёном свете" loading="lazy"></figure>
    <div>
      <h2 id="letter-title">Сань, с днём рождения.</h2>
      <p>Пусть будет куда сорваться, с кем зависнуть и ради чего вставать пораньше. А если планов нет — пусть и так будет хорошо.</p>
    </div>
  </section>
  <section class="wishes" aria-labelledby="wishes-title">
    <h2 id="wishes-title">И ещё тебе</h2>
    <div id="stream" class="stream">
      <span id="dots" aria-hidden="true">…</span>
      <noscript>Удачи, сил, своих рядом и свободы!</noscript>
    </div>
    <button id="more" type="button" hidden>Ещё пожеланий <span aria-hidden="true">＋</span></button>
    <div id="sentinel"></div>
  </section>
</main>
<script type="module" src="scene.bundle.js"></script>
</body>
</html>
