    const s = document.createElement('span');
    s.className = w.cls;
    s.textContent = w.text;
    const c = document.createElement('span');
    c.className = 'cm';
    c.textContent = ',';
    s.appendChild(c);
    frag.appendChild(s);
  }
  stream.insertBefore(frag, dots);
  countEl.textContent = v.count;
}
comp.setSentinel(document.getElementById('sentinel'));
document.getElementById('more').addEventListener('click', () => comp.more());
paint();
comp.componentDidMount();

</script>
</body>
</html>
